<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ALDI PALLET STACKER - Warehouse Edition</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1e293b; user-select: none; -webkit-user-select: none; }
  canvas { display: block; touch-action: none; -webkit-tap-highlight-color: transparent; image-rendering: pixelated; }
  
  /* Input Modal styling */
  #name-modal {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.85);
    z-index: 10;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', Courier, monospace;
    color: #f8fafc;
    padding: 20px;
    box-sizing: border-box;
  }
  .modal-box {
    background: #0f172a;
    padding: 30px;
    border-radius: 4px;
    border: 4px solid #f97316; /* Aldi Orange */
    width: 100%;
    max-width: 320px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(249, 115, 22, 0.4);
  }
  .modal-box h2 {
    margin: 0 0 10px 0;
    font-size: 24px;
    font-weight: 900;
    letter-spacing: 2px;
    color: #fbbf24; /* Aldi Yellow */
  }
  .modal-box p {
    margin: 0 0 20px 0;
    font-size: 13px;
    color: #94a3b8;
    line-height: 1.4;
  }
  .modal-box input {
    width: 100%;
    padding: 14px;
    border-radius: 2px;
    border: 2px solid #334155;
    background: #1e293b;
    color: #f8fafc;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    outline: none;
    margin-bottom: 15px;
    box-sizing: border-box;
    text-transform: uppercase;
    font-family: 'Courier New', Courier, monospace;
  }
  .modal-box input:focus {
    border-color: #38bdf8;
  }
  .modal-box button {
    width: 100%;
    padding: 14px;
    border-radius: 2px;
    border: none;
    background: #f97316;
    color: white;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 1px;
    box-shadow: 0 4px 0 #c2410c;
  }
  .modal-box button:active {
    transform: translateY(2px);
    box-shadow: 0 2px 0 #c2410c;
  }
  .error-msg {
    color: #ef4444;
    font-size: 12px;
    font-weight: bold;
    margin-bottom: 15px;
    min-height: 18px;
  }
  
  /* Player Badge */
  #player-profile-badge {
    position: absolute;
    bottom: 15px;
    left: 15px;
    font-family: 'Courier New', Courier, monospace;
    color: rgba(255,255,255,0.7);
    font-size: 12px;
    font-weight: bold;
    background: rgba(15, 23, 42, 0.9);
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    border: 2px solid #334155;
    z-index: 5;
  }
  #player-profile-badge:hover {
    border-color: #f97316;
  }
</style>
</head>
<body>

<canvas id="c"></canvas>

<!-- Profile Badge -->
<div id="player-profile-badge">
  LOADER: <span id="player-badge-name" style="color: #fbbf24;">GUEST</span> (tap to edit)
</div>

<!-- Name Modal -->
<div id="name-modal">
  <div class="modal-box">
    <h2 id="modal-title">HIGH SCORE!</h2>
    <p id="modal-desc">Enter your name for the Warehouse Leaderboard:</p>
    <input type="text" id="player-name-input" maxlength="10" placeholder="YOUR NAME" autocomplete="off" spellcheck="false">
    <div id="name-error" class="error-msg"></div>
    <button id="submit-name-btn">SUBMIT</button>
  </div>
</div>

<script>
(() => {
  // ---- Firebase Realtime Database Config ----
  const dbUrl = "https://stackerjack-f09ef-default-rtdb.europe-west1.firebasedatabase.app/";
  const useDatabase = dbUrl && dbUrl !== "YOUR_DATABASE_URL";

  // ---- Mock Online Leaderboard Fallback ----
  let localScores = [
    { name: 'SUPERVISOR', score: 25, timestamp: Date.now() - 100000 },
    { name: 'FORKLIFT', score: 15, timestamp: Date.now() - 50000 },
    { name: 'STCKER', score: 8, timestamp: Date.now() - 20000 }
  ];

  // ---- Offensive Word Filtering List ----
  const badWords = [
    'fuck', 'shit', 'ass', 'cunt', 'bitch', 'dick', 'pussy', 'bastard', 
    'cock', 'wank', 'twat', 'slut', 'whore', 'nigger', 'faggot', 'kike', 
    'chink', 'retard', 'dyke', 'rape', 'pedophile'
  ];

  function isOffensive(name) {
    const lower = name.toLowerCase();
    return badWords.some(word => lower.includes(word));
  }

  // ---- Canvas Game Engine ----
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  let W, H, dpr;

  const BLOCK_H   = 40;   // pallet height
  const BOTTOM_PAD= 110;  
  const PERFECT   = 5;    

  let stack, current, debris, floaters, particles;
  let offset, score, best, state, speed, shake, overTime, nextDir, baseWidth, perfectCombo;
  let countdownVal = 3, countdownStartTime = 0;
  let scrollText = [
    "EPISODE IV: A NEW PALLET",
    "",
    "It is a period of civil warehouse war.",
    "Rebel delivery trucks, striking from",
    "the loading bay, have won their",
    "first victory against the evil",
    "Store Manager empire.",
    "",
    "During the battle, Aldi Alan, brave",
    "stockroom hero, managed to steal",
    "the ultimate warehouse secret:",
    "THE INFINITE PALLET STACK.",
    "",
    "Pursued by the boss's relentless",
    "stopwatch, Alan races toward the",
    "forklift, custodian of his home,",
    "and our only hope to save the aisle...",
    "",
    "TAP TO BEGIN THE SHIFT!"
  ];
  let scrollPos = H + 100;
  let scrollSpeed = 0.65; // Slower, readable scroll speed
  let scrollActive = true;
  best = parseInt(localStorage.getItem('aldi_stack_best') || '0', 10);

  let scoreToPlayer = {};
  let pendingScoreSubmit = null;
  let isChangingNameOnly = false;

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  const toScreenY = (worldBottom, h = 0) => H - BOTTOM_PAD - (worldBottom + h) + offset;
  const topBlock = () => stack[stack.length - 1];

  function reset() {
    baseWidth = Math.min(W * 0.6, 280);
    stack = [{ x: (W - baseWidth) / 2, width: baseWidth, type: 'pallet' }];
    score = 0; speed = 2.0; shake = 0; offset = 0; perfectCombo = 0;
    nextDir = Math.random() < 0.5 ? 1 : -1;
    debris = []; floaters = []; particles = [];
    scrollPos = H + 50;
    scrollActive = true;
    spawnCurrent();
  }

  function getNextBlockType() {
    if (score > 0 && score % 5 === 0) return 'special';
    if (score > 0 && score % 3 === 0) return 'drinks';
    return 'pallet';
  }

  function spawnCurrent() {
    const t = topBlock();
    current = {
      width: t.width,
      type: getNextBlockType(),
      dir: nextDir,
      x: nextDir === 1 ? 15 : W - 15 - t.width
    };
  }

  function placeSplash() {
    const t = topBlock(), c = current;
    speed = 1.5;
    const oStart = Math.max(c.x, t.x);
    const oEnd   = Math.min(c.x + c.width, t.x + t.width);
    const oW     = oEnd - oStart;

    if (oW <= 0 || stack.length > 20) {
      reset();
      state = 'splash';
      return;
    }

    nextDir *= -1;
    stack.push({ x: oStart, width: oW, type: c.type });
    score++;
    spawnCurrent();
  }

  function place() {
    const t = topBlock(), c = current;
    const oStart = Math.max(c.x, t.x);
    const oEnd   = Math.min(c.x + c.width, t.x + t.width);
    const oW     = oEnd - oStart;
    const slot   = stack.length * BLOCK_H;

    if (oW <= 0) { // Missed entirely
      debris.push({ x: c.x, y: slot, w: c.width, h: BLOCK_H,
                    vx: c.dir * 3.5, vy: 2.5, rot: 0,
                    vr: (Math.random() * 0.2 - 0.1), type: c.type });
      current = null;
      doGameOver();
      return;
    }

    nextDir *= -1;
    const delta = c.width - oW;
    let nx, nw;

    if (delta <= PERFECT) {
      nx = t.x; nw = t.width;
      perfectCombo++;
      perfectFx(slot, c.x + c.width / 2, c.type);
    } else {
      nx = oStart; nw = oW;
      perfectCombo = 0;
      if (c.x < oStart)
        debris.push({ x: c.x, y: slot, w: oStart - c.x, h: BLOCK_H,
                      vx: -2.0 - Math.random(), vy: 1.5, rot: 0,
                      vr: -(Math.random() * 0.12 + 0.02), type: c.type });
      if (c.x + c.width > oEnd)
        debris.push({ x: oEnd, y: slot, w: c.x + c.width - oEnd, h: BLOCK_H,
                      vx: 2.0 + Math.random(), vy: 1.5, rot: 0,
                      vr: (Math.random() * 0.12 + 0.02), type: c.type });
    }

    stack.push({ x: nx, width: nw, type: c.type });
    score++;
    if (score > best) { best = score; localStorage.setItem('aldi_stack_best', best); }
    speed = Math.min(2.0 + score * 0.14, 6.8);
    spawnCurrent();
  }

  function perfectFx(worldY, cx, type) {
    floaters.push({
      text: perfectCombo > 1 ? 'PERFECT x' + perfectCombo : 'NAILED IT!',
      x: cx, y: worldY + BLOCK_H, life: 1, type
    });
    for (let i = 0; i < 18; i++) {
      const a = Math.random() * Math.PI * 2, s = 2 + Math.random() * 4;
      particles.push({ x: cx, y: worldY + BLOCK_H / 2,
                       vx: Math.cos(a) * s, vy: Math.sin(a) * s + 1,
                       life: 1, type });
    }
  }

  function doGameOver() { 
    state = 'over'; 
    overTime = performance.now(); 
    shake = 1.4; 
    handleGameOverScore();
  }

  // ---- Update ----
  function update() {
    const N = stack.length;
    let target = H * 0.52 - H + BOTTOM_PAD + (N + 1) * BLOCK_H;
    if (target < 0) target = 0;
    offset += (target - offset) * 0.12;

    if ((state === 'playing' || state === 'splash') && current) {
      current.x += current.dir * speed;
      const minX = 20, maxX = W - 20 - current.width;
      if (current.x <= minX) { current.x = minX; current.dir = 1; }
      else if (current.x >= maxX) { current.x = maxX; current.dir = -1; }
      
      if (state === 'splash') {
        const t = topBlock();
        const targetX = t.x + (t.width - current.width) / 2;
        if (Math.abs(current.x - targetX) < speed * 1.2 || (current.dir === 1 && current.x >= targetX) || (current.dir === -1 && current.x <= targetX)) {
          placeSplash();
        }
      }
    }

    for (let i = debris.length - 1; i >= 0; i--) {
      const d = debris[i];
      d.x += d.vx; d.y += d.vy; d.vy -= 0.5; d.rot += d.vr;
      if (toScreenY(d.y, d.h) > H + 150) debris.splice(i, 1);
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.vy -= 0.35; p.life -= 0.03;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i];
      f.y += 1.2; f.life -= 0.02;
      if (f.life <= 0) floaters.splice(i, 1);
    }
    if (shake > 0) shake *= 0.9;

    // Scroll text animation for splash screen
    if (state === 'splash' && scrollActive) {
      scrollPos -= scrollSpeed;
      // When all text has scrolled completely off into the distance, restart crawl
      const totalHeight = scrollText.length * 42;
      if (scrollPos < -totalHeight - 100) {
        scrollPos = H + 100;
      }
    }

    if (state === 'countdown') {
      const elapsed = performance.now() - countdownStartTime;
      if (elapsed > 3000) {
        state = 'playing';
      } else if (elapsed > 2000) {
        countdownVal = 1;
      } else if (elapsed > 1000) {
        countdownVal = 2;
      } else {
        countdownVal = 3;
      }
    }
  }

  // ---- HD Pixel Art Warehouse & Pallet Drawing (Stardew Valley style) ----
  function drawWarehouseBackground() {
    // 1. Warm cinder block wall with texture
    ctx.fillStyle = '#8a8578';
    ctx.fillRect(0, 0, W, H);

    // Cinder block mortar lines - horizontal and vertical grid
    ctx.strokeStyle = '#6a6558';
    ctx.lineWidth = 1;
    const blockH = 28;
    const blockW = 56;
    for (let y = 0; y < H; y += blockH) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
    for (let x = 0; x < W; x += blockW) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }

    // 2. Concrete floor gradient (warm gray, matches reference)
    const floorGrad = ctx.createLinearGradient(0, H * 0.55, 0, H);
    floorGrad.addColorStop(0, '#6a6558');
    floorGrad.addColorStop(1, '#4a4538');
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, H * 0.55, W, H * 0.45);

    // 3. Metal shelving - blue-gray uprights with orange shelf beams
    ctx.fillStyle = '#4a6a8a';
    ctx.fillRect(28, 0, 16, H);
    ctx.fillRect(172, 0, 16, H);

    // Shelf beams (orange, matches reference)
    ctx.fillStyle = '#c5622a';
    ctx.fillRect(20, 70, 180, 10);
    ctx.fillRect(20, 220, 180, 10);
    ctx.fillRect(20, 370, 180, 10);

    // Cardboard crates with X cross braces on shelves
    drawShelfCrate(35, 30, 50, 40);
    drawShelfCrate(100, 10, 55, 50);
    drawShelfCrate(35, 180, 50, 40);
    drawShelfCrate(100, 160, 55, 50);
    drawShelfCrate(35, 330, 50, 40);
    drawShelfCrate(100, 310, 55, 50);

    // 4. Conveyor belt on right side
    ctx.fillStyle = '#5a6a7a';
    ctx.fillRect(W - 220, H * 0.35, 200, 60);
    ctx.fillStyle = '#3a4a5a';
    ctx.fillRect(W - 210, H * 0.37, 180, 20);
    // Conveyor rollers
    for (let cx = W - 200; cx < W - 40; cx += 16) {
      ctx.fillStyle = '#7a8a9a';
      ctx.fillRect(cx, H * 0.44, 8, 8);
    }

    // 5. Worker in blue shirt & glasses
    drawWarehouseWorker(W - 140, H - BOTTOM_PAD - 60);
  }

  function drawShelfCrate(x, y, w, h) {
    // Cardboard brown (matches reference)
    ctx.fillStyle = '#b4824a';
    ctx.fillRect(x, y, w, h);
    // Dark outline
    ctx.strokeStyle = '#6b4a2a';
    ctx.lineWidth = 2;
    ctx.strokeRect(x, y, w, h);

    // X cross-bracing tape (matches reference crates)
    ctx.strokeStyle = '#7a5a3a';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x + 4, y + 4); ctx.lineTo(x + w - 4, y + h - 4);
    ctx.moveTo(x + w - 4, y + 4); ctx.lineTo(x + 4, y + h - 4);
    ctx.stroke();

    // Tape seal on top
    ctx.fillStyle = '#8a6a4a';
    ctx.fillRect(x + w / 2 - 8, y, 16, 4);
  }

  function drawWarehouseWorker(x, y) {
    ctx.save();
    ctx.translate(x, y);
    // Blue shirt (matches reference)
    ctx.fillStyle = '#3a8ad0';
    ctx.fillRect(12, 18, 28, 34);
    // Black pants
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(16, 52, 10, 30);
    ctx.fillRect(28, 52, 10, 30);
    // Head & skin
    ctx.fillStyle = '#d07060';
    ctx.fillRect(16, 4, 18, 18);
    // Blonde hair
    ctx.fillStyle = '#e0a030';
    ctx.fillRect(16, 0, 18, 6);
    // Glasses
    ctx.fillStyle = '#000';
    ctx.fillRect(20, 8, 10, 4);
    // Arms holding pallet
    ctx.fillStyle = '#d07060';
    ctx.fillRect(8, 28, 10, 8);
    ctx.fillRect(34, 28, 10, 8);
    ctx.restore();
  }

  function drawPalletBlock(x, worldBottom, w, type) {
    const y = toScreenY(worldBottom, BLOCK_H);

    // === TOP DECK: Individual parallel slats with highlight/shadow ===
    const slatH = 4;
    const slatGap = 1;
    const slatColors = ['#d4a060', '#c09050', '#b08040'];
    for (let sy = 0; sy < 10; sy += slatH + slatGap) {
      const colorIdx = sy % 3;
      ctx.fillStyle = slatColors[colorIdx];
      ctx.fillRect(x, y + sy, w, slatH);
      // Top highlight on each slat
      ctx.fillStyle = 'rgba(255,220,180,0.3)';
      ctx.fillRect(x, y + sy, w, 1);
    }

    // === STRINGER LAYER: Horizontal boards with rectangular cutout gaps ===
    ctx.fillStyle = '#a07030';
    ctx.fillRect(x, y + 10, w, 6);
    // Stringer cutout gaps (dark rectangular notches)
    ctx.fillStyle = '#1a1a1a';
    const gapW = 20;
    const gapH = 8;
    for (let gx = x + 8; gx < x + w - 8; gx += gapW + 12) {
      ctx.fillRect(gx, y + 12, gapW, gapH);
      // Inner wood edge on cutout
      ctx.fillStyle = '#3a2010';
      ctx.fillRect(gx, y + 12, gapW, 1);
      ctx.fillRect(gx, y + 19, gapW, 1);
      ctx.fillStyle = '#1a1a1a';
    }

    // === BOTTOM DECK: Bottom board with shadow ===
    ctx.fillStyle = '#8a6030';
    ctx.fillRect(x, y + 16, w, 8);
    // Bottom shadow
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(x, y + 22, w, 2);

    // === CARGO BOX / CARTONS sitting on top of pallet ===
    let boxColor = '#b08040';
    let labelColor = '#3a60a0';
    if (type === 'special') {
      boxColor = '#d04080';
      labelColor = '#f0c040';
    } else if (type === 'drinks') {
      boxColor = '#2050a0';
      labelColor = '#ffffff';
    }

    // Box body with 3D shading
    ctx.fillStyle = boxColor;
    ctx.fillRect(x + 4, y - 24, w - 8, 24);
    // Box top highlight
    ctx.fillStyle = 'rgba(255,255,255,0.15)';
    ctx.fillRect(x + 4, y - 24, w - 8, 3);
    // Box outline
    ctx.strokeStyle = '#4a2a10';
    ctx.lineWidth = 1;
    ctx.strokeRect(x + 4, y - 24, w - 8, 24);

    // Aldi Label stamp
    if (w > 45) {
      ctx.fillStyle = labelColor;
      ctx.fillRect(x + w / 2 - 14, y - 18, 28, 10);
      ctx.fillStyle = '#1a1a1a';
      ctx.font = 'bold 75% "Courier New", monospace';
      ctx.textAlign = 'center';
      let lbl = type === 'special' ? 'SPECIAL' : (type === 'drinks' ? 'DRINKS' : 'ALDI');
      ctx.fillText(lbl, x + w / 2, y - 11);
    }
  }

  function drawDebris(d) {
    const y = toScreenY(d.y, d.h);
    ctx.save();
    ctx.translate(d.x + d.w / 2, y + d.h / 2);
    ctx.rotate(d.rot);
    ctx.fillStyle = d.type === 'special' ? '#db2777' : '#a16207';
    ctx.fillRect(-d.w / 2, -d.h / 2, d.w, d.h);
    ctx.restore();
  }

  function drawHighScoreLines() {
    ctx.save();
    for (const [scoreStr, name] of Object.entries(scoreToPlayer)) {
      const sVal = parseInt(scoreStr, 10);
      if (sVal <= 0) continue;
      
      const worldTop = (sVal + 1) * BLOCK_H;
      const sy = H - BOTTOM_PAD - worldTop + offset;
      
      if (sy > 0 && sy < H) {
        ctx.strokeStyle = 'rgba(249, 115, 22, 0.45)';
        ctx.lineWidth = 2;
        ctx.setLineDash([4, 4]);
        
        ctx.beginPath();
        ctx.moveTo(20, sy);
        ctx.lineTo(W - 20, sy);
        ctx.stroke();
        
        ctx.fillStyle = '#fbbf24';
        ctx.font = 'bold 11px "Courier New", monospace';
        ctx.textAlign = 'right';
        ctx.fillText(`🏆 ${name} (${sVal})`, W - 25, sy - 5);
      }
    }
    ctx.restore();
  }

  function draw() {
    if (state !== 'splash') {
      drawWarehouseBackground();
    } else {
      // Dark background for splash screen
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, W, H);
    }

    ctx.save();
    if (shake > 0.01)
      ctx.translate((Math.random() - 0.5) * shake * 12, (Math.random() - 0.5) * shake * 12);

    if (state !== 'splash') {
      for (let i = 0; i < stack.length; i++) {
        const b = stack[i];
        drawPalletBlock(b.x, i * BLOCK_H, b.width, b.type);
      }
      if (current && state !== 'over' && state !== 'countdown')
        drawPalletBlock(current.x, stack.length * BLOCK_H, current.width, current.type);
      for (const d of debris) drawDebris(d);

      drawHighScoreLines();
    }

    for (const p of particles) {
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.type === 'special' ? '#ec4899' : '#fbbf24';
      const sy = H - BOTTOM_PAD - p.y + offset;
      ctx.fillRect(p.x - 3, sy - 3, 6, 6);
    }
    ctx.globalAlpha = 1;

    for (const f of floaters) {
      ctx.globalAlpha = Math.max(f.life, 0);
      ctx.fillStyle = f.type === 'special' ? '#f472b6' : '#fbbf24';
      ctx.font = '900 18px "Courier New", monospace';
      ctx.textAlign = 'center';
      const sy = H - BOTTOM_PAD - f.y + offset;
      ctx.fillText(f.text, f.x, sy);
    }
    ctx.globalAlpha = 1;
    ctx.restore();

    drawUI();
  }

  function drawUI() {
    ctx.textAlign = 'center';
    if (state === 'splash') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(0, 0, W, H);

      // Star Wars style perspective crawl text
      ctx.save();
      
      // Clip to center area so text doesn't spill off sides
      ctx.beginPath();
      ctx.rect(W * 0.05, 20, W * 0.9, H * 0.7);
      ctx.clip();

      ctx.translate(W / 2, scrollPos);

      // Apply Star Wars perspective scale (shrinking as it goes up)
      
      for (let i = 0; i < scrollText.length; i++) {
        const lineY = i * 42;
        const currentY = scrollPos + lineY;
        
        // Only render if roughly visible
        if (currentY > -50 && currentY < H + 50) {
          // Perspective scale based on height
          const progress = Math.max(0, Math.min(1, currentY / H));
          const scale = 0.5 + progress * 0.6;
          const alpha = Math.max(0, Math.min(1, progress * 1.5));

          ctx.save();
          ctx.translate(0, lineY);
          ctx.scale(scale, scale);

          ctx.globalAlpha = alpha;
          ctx.fillStyle = '#fbbf24'; // Classic yellow crawl
          ctx.font = '700 22px "Courier New", monospace';
          ctx.textAlign = 'center';

          // Glow effect
          ctx.shadowColor = '#f97316';
          ctx.shadowBlur = 10;
          ctx.fillText(scrollText[i], 0, 0);
          
          ctx.restore();
        }
      }
      ctx.restore();

      // Title
      ctx.fillStyle = '#fbbf24';
      ctx.font = '900 42px "Courier New", monospace';
      ctx.fillText('ALDI WAREHOUSE', W / 2, H * 0.85);
      ctx.fillStyle = '#f97316';
      ctx.fillText('STACKER', W / 2, H * 0.85 + 44);

      ctx.font = 'bold 13px "Courier New", monospace';
      ctx.fillStyle = '#38bdf8';
      ctx.fillText('ONLINE LEADERBOARD EDITION', W / 2, H * 0.85 + 84);

      const pulse = 0.6 + 0.4 * Math.sin(performance.now() / 300);
      ctx.globalAlpha = pulse;
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px "Courier New", monospace';
      ctx.fillText('TAP TO START SHIFT', W / 2, H * 0.95);
      ctx.globalAlpha = 1;

      if (best > 0) {
        ctx.fillStyle = '#94a3b8';
        ctx.font = '16px "Courier New", monospace';
        ctx.fillText('PERSONAL BEST: ' + best, W / 2, H * 0.95 + 45);
      }
    } else if (state === 'countdown') {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
      ctx.fillRect(0, 0, W, H);

      const elapsed = performance.now() - countdownStartTime;
      const phaseElapsed = elapsed % 1000;
      const scale = 1 + Math.max(0, (300 - phaseElapsed) / 300) * 0.5;

      ctx.save();
      ctx.translate(W / 2, H * 0.45);
      ctx.scale(scale, scale);

      ctx.fillStyle = '#fbbf24';
      ctx.font = '900 100px "Courier New", monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(countdownVal, 0, 0);
      ctx.restore();
    } else {
      ctx.fillStyle = '#ffffff';
      ctx.font = '900 56px "Courier New", monospace';
      ctx.fillText(score, W / 2, H * 0.14);

      if (state === 'over') {
        ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
        ctx.fillRect(0, 0, W, H);
        ctx.fillStyle = '#ef4444';
        ctx.font = '900 36px "Courier New", monospace';
        ctx.fillText('SHIFT OVER', W / 2, H * 0.38);
        ctx.fillStyle = '#f8fafc';
        ctx.font = 'bold 20px "Courier New", monospace';
        ctx.fillText('PALLETS: ' + score + ' | BEST: ' + best, W / 2, H * 0.38 + 45);

        if (performance.now() - overTime > 500 && !isModalOpen()) {
          const pulse = 0.5 + 0.5 * Math.sin(performance.now() / 350);
          ctx.globalAlpha = pulse;
          ctx.font = 'bold 18px "Courier New", monospace';
          ctx.fillStyle = '#fbbf24';
          ctx.fillText('TAP TO RESTART SHIFT', W / 2, H * 0.38 + 100);
          ctx.globalAlpha = 1;
        }
      }
    }
  }

  // ---- Input & Interaction ----
  function press() {
    if (isModalOpen()) return;
    
    if (state === 'splash') {
      startCountdown();
    } else if (state === 'playing') {
      place();
    } else if (state === 'over' && performance.now() - overTime > 500) {
      startCountdown();
    }
  }

  function startCountdown() {
    reset();
    state = 'countdown';
    countdownVal = 3;
    countdownStartTime = performance.now();
  }

  window.addEventListener('pointerdown', e => { 
    if (e.target.closest('#player-profile-badge') || e.target.closest('#name-modal')) return;
    e.preventDefault(); 
    press(); 
  });

  window.addEventListener('keydown', e => {
    if (isModalOpen()) return;
    if (e.code === 'Space' || e.code === 'Enter') { e.preventDefault(); press(); }
  });

  // ---- Database Scoring Operations ----
  async function fetchScores() {
    if (useDatabase) {
      try {
        const response = await fetch(`${dbUrl}scores.json`);
        const data = await response.json();
        
        const fetched = [];
        if (data) {
          Object.keys(data).forEach(key => {
            if (data[key] && data[key].name && typeof data[key].score === 'number') {
              fetched.push(data[key]);
            }
          });
        }
        
        const playerTopMap = {};
        for (const entry of fetched) {
          const name = entry.name.toUpperCase();
          const score = parseInt(entry.score, 10);
          const timestamp = entry.timestamp || 0;

          if (!playerTopMap[name] || score > playerTopMap[name].score || (score === playerTopMap[name].score && timestamp < playerTopMap[name].timestamp)) {
            playerTopMap[name] = { score, timestamp };
          }
        }

        scoreToPlayer = {};
        for (const [name, info] of Object.entries(playerTopMap)) {
          if (!scoreToPlayer[info.score] || info.timestamp < scoreToPlayer[info.score].timestamp) {
            scoreToPlayer[info.score] = name;
          }
        }
      } catch (err) {
        console.error("Failed to fetch online scores:", err);
      }
    }
  }

  async function submitScoreToDatabase(name, scoreVal) {
    if (!useDatabase) return;
    try {
      await fetch(`${dbUrl}scores.json`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name: name.toUpperCase(), score: scoreVal, timestamp: Date.now() })
      });
      await fetchScores();
    } catch (err) {
      console.error("Failed to submit score:", err);
    }
  }

  // ---- Player Name & Modal Management ----
  let playerName = localStorage.getItem('aldi_stack_player_name') || '';
  const badgeNameEl = document.getElementById('player-badge-name');
  const modalEl = document.getElementById('name-modal');
  const nameInputEl = document.getElementById('player-name-input');
  const nameErrorEl = document.getElementById('name-error');
  const submitBtnEl = document.getElementById('submit-name-btn');
  const playerBadgeEl = document.getElementById('player-profile-badge');

  function updateBadge() {
    badgeNameEl.textContent = playerName ? playerName : 'GUEST';
  }
  updateBadge();

  function isModalOpen() {
    return modalEl.style.display === 'flex';
  }

  function openNameModal(isEditOnly = false) {
    isChangingNameOnly = isEditOnly;
    nameInputEl.value = playerName;
    nameErrorEl.textContent = '';
    
    const titleEl = document.getElementById('modal-title');
    const descEl = document.getElementById('modal-desc');
    
    if (isEditOnly) {
      titleEl.textContent = 'LOADER PROFILE';
      descEl.textContent = 'Enter your warehouse worker name (QWERTY only):';
      submitBtnEl.textContent = 'SAVE';
    } else {
      titleEl.textContent = 'SHIFT RECORD!';
      descEl.textContent = `You stacked ${score} pallets! Enter your name for the board:`;
      submitBtnEl.textContent = 'SUBMIT';
    }

    modalEl.style.display = 'flex';
    setTimeout(() => nameInputEl.focus(), 50);
  }

  function closeNameModal() {
    modalEl.style.display = 'none';
  }

  playerBadgeEl.addEventListener('click', () => {
    openNameModal(true);
  });

  async function handleGameOverScore() {
    if (score <= 0) return;
    
    if (!playerName) {
      pendingScoreSubmit = score;
      openNameModal(false);
    } else {
      await submitScoreToDatabase(playerName, score);
    }
  }

  submitBtnEl.addEventListener('click', async () => {
    const raw = nameInputEl.value.trim();
    if (!raw) {
      nameErrorEl.textContent = 'Name cannot be empty.';
      return;
    }
    if (!/^[a-zA-Z0-9\s]+$/.test(raw)) {
      nameErrorEl.textContent = 'English QWERTY letters/numbers only.';
      return;
    }
    if (isOffensive(raw)) {
      nameErrorEl.textContent = 'Please choose a polite name.';
      return;
    }

    playerName = raw.toUpperCase().substring(0, 10);
    localStorage.setItem('aldi_stack_player_name', playerName);
    updateBadge();
    closeNameModal();

    if (!isChangingNameOnly && pendingScoreSubmit !== null) {
      const s = pendingScoreSubmit;
      pendingScoreSubmit = null;
      await submitScoreToDatabase(playerName, s);
    }
  });

  nameInputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      submitBtnEl.click();
    }
  });

  // ---- Main Loop ----
  function loop() {
    update();
    draw();
    requestAnimationFrame(loop);
  }

  fetchScores().then(() => {
    reset();
    state = 'splash';
    requestAnimationFrame(loop);
  });

})();
</script>

</body>
</html>
